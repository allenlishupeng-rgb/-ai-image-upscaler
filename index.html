<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 图像超分辨率放大工具</title>
<style>
:root{color-scheme:dark;--bg:#0e1116;--panel:#171b22;--panel2:#202733;--text:#eef3f8;--muted:#98a5b4;--line:#303846;--accent:#20c997;--danger:#ff6b6b;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}main{min-height:100vh;display:grid;grid-template-rows:auto 1fr}header{border-bottom:1px solid var(--line);padding:18px clamp(16px,3vw,34px);display:flex;align-items:center;justify-content:space-between;gap:16px;background:#0e1116}h1{margin:0;font-size:clamp(18px,2vw,24px)}.status{color:var(--muted);font-size:14px;text-align:right}.warn{color:var(--danger)}.workspace{display:grid;grid-template-columns:340px 1fr;min-height:0}aside{border-right:1px solid var(--line);padding:22px;background:var(--panel);display:flex;flex-direction:column;gap:18px}.dropzone{border:1px dashed #596575;background:#121821;min-height:180px;border-radius:8px;display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer}.dropzone:hover,.dropzone.dragover{border-color:var(--accent);background:#14211f}.dropzone strong{display:block;font-size:17px;margin-bottom:8px}.dropzone span{color:var(--muted);font-size:13px;line-height:1.5}input[type=file]{display:none}.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:16px}.metric{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}.metric:last-child{border-bottom:0}.metric span:first-child,label{color:var(--muted)}.controls{display:grid;gap:12px}label{display:block;font-size:13px;margin-bottom:8px}select,input,button{width:100%;min-height:44px;border-radius:8px;border:1px solid var(--line);background:#10161f;color:var(--text);padding:0 12px;font:inherit}button{cursor:pointer;font-weight:720;border-color:transparent;background:var(--accent);color:#04110d}button.secondary{background:#111821;color:var(--text);border-color:var(--line)}button:disabled{cursor:not-allowed;opacity:.45}.progress{height:8px;border-radius:999px;background:#0c1016;overflow:hidden;border:1px solid #252d38}.progress>div{width:0;height:100%;background:linear-gradient(90deg,var(--accent),#4dabf7)}.viewer{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr auto;background:#0b0d11}.toolbar{border-bottom:1px solid var(--line);padding:12px clamp(16px,2.4vw,30px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0e1116}.zoom{display:flex;align-items:center;gap:10px}.zoom label{margin:0;white-space:nowrap}.zoom select{min-height:36px;width:130px}.toolbar span,footer{color:var(--muted);font-size:13px}.stage{min-height:0;overflow:auto;padding:clamp(16px,2.4vw,30px)}.empty{color:var(--muted);text-align:center;line-height:1.6;max-width:560px;min-height:52vh;display:grid;place-items:center;margin:0 auto;padding:24px}.compare{display:grid;grid-template-columns:minmax(360px,1fr) minmax(360px,1fr);gap:18px;align-items:start}.pane{min-width:0;border:1px solid var(--line);border-radius:8px;background:rgba(16,22,31,.86);overflow:hidden}.pane-head{height:46px;border-bottom:1px solid var(--line);padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.pane-head strong{color:var(--text);font-size:14px}.scroll{overflow:auto;height:calc(100vh - 190px);min-height:360px;padding:18px;cursor:grab;user-select:none;touch-action:none}.scroll.dragging{cursor:grabbing}canvas{display:block;background:#05070a;box-shadow:0 18px 55px rgba(0,0,0,.44);transform-origin:top left}footer{border-top:1px solid var(--line);padding:12px clamp(16px,2.4vw,30px);display:flex;justify-content:space-between;gap:12px;background:#0e1116}@media(max-width:980px){.workspace{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.compare{grid-template-columns:1fr}.scroll{height:52vh}}@media(max-width:620px){header,footer,.toolbar{align-items:flex-start;flex-direction:column}.zoom{width:100%;justify-content:space-between}}
</style>
</head>
<body>
<main><header><h1>AI 图像超分辨率放大工具</h1><div id="status" class="status">正在检查 AI 引擎</div></header>
<section class="workspace"><aside>
<label class="dropzone" id="dropzone"><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"><div><strong>选择或拖入图片</strong><span>仅在本机处理，不上传。输出会提升分辨率并重建图像细节。</span></div></label>
<div class="panel"><div class="metric"><span>原始尺寸</span><span id="sourceSize">-</span></div><div class="metric"><span>目标尺寸</span><span id="targetSize">-</span></div><div class="metric"><span>放大倍率</span><span id="scaleLabel">2x</span></div></div>
<div class="controls"><div><label for="scale">分辨率升级</label><select id="scale"><option value="2">2K -> 4K / 4K -> 8K (2x)</option><option value="4">2K -> 8K (4x)</option><option value="enhance8k">增强 8K（保持原尺寸）</option></select></div><div><label for="model">AI 模型</label><select id="model"><option value="photo">照片细节修复</option><option value="clean">自然干净放大（通用模型）</option><option value="anime">动漫 / 插画</option></select></div><div><label for="backendUrl">AI 后端地址</label><input id="backendUrl" type="url" placeholder="留空使用当前本机后端"></div><button id="processBtn" disabled>AI 放大</button><button id="downloadBtn" class="secondary" disabled>导出放大图 PNG</button><div class="progress"><div id="bar"></div></div></div>
</aside><section class="viewer"><div class="toolbar"><span>处理完成后可直接对比原图和 AI 放大结果。</span><div class="zoom"><label for="zoom">预览倍率</label><select id="zoom"><option value="0.2">20%</option><option value="0.5">50%</option><option value="1">100%</option><option value="2" selected>200%</option><option value="5">500%</option><option value="8">800%</option></select></div></div><div class="stage"><div id="empty" class="empty">图片会显示在这里。上传后左侧显示原始图片，AI 放大完成后右侧显示高分辨率结果。</div><div id="compare" class="compare" hidden><section class="pane"><div class="pane-head"><strong>原始图片</strong><span id="originalPaneSize">-</span></div><div class="scroll"><canvas id="originalCanvas"></canvas></div></section><section class="pane"><div class="pane-head"><strong>AI 放大结果</strong><span id="resultPaneSize">等待处理</span></div><div class="scroll"><canvas id="resultCanvas"></canvas></div></section></div></div><footer><span id="fileName">未选择文件</span><span>GitHub Pages 只托管网页；AI 放大需要连接后端。</span></footer></section></section></main>
<script>
const $=s=>document.querySelector(s);const fileInput=$("#fileInput"),dropzone=$("#dropzone"),processBtn=$("#processBtn"),downloadBtn=$("#downloadBtn"),scaleSelect=$("#scale"),modelSelect=$("#model"),zoomSelect=$("#zoom"),backendUrlInput=$("#backendUrl"),statusEl=$("#status"),sourceSizeEl=$("#sourceSize"),targetSizeEl=$("#targetSize"),scaleLabelEl=$("#scaleLabel"),fileNameEl=$("#fileName"),originalPaneSize=$("#originalPaneSize"),resultPaneSize=$("#resultPaneSize"),empty=$("#empty"),compare=$("#compare"),originalCanvas=$("#originalCanvas"),resultCanvas=$("#resultCanvas"),bar=$("#bar");const originalCtx=originalCanvas.getContext("2d"),resultCtx=resultCanvas.getContext("2d");let sourceBitmap=null,sourceFile=null,sourceName="upscaled",processing=false,aiReady=false,resultBlob=null;function setStatus(t,e=false){statusEl.textContent=t;statusEl.classList.toggle("warn",e)}function setProgress(v){bar.style.width=Math.max(0,Math.min(100,v))+"%"}function size(w,h){return w&&h?`${w.toLocaleString()} x ${h.toLocaleString()}`:"-"}function apiUrl(p){const b=backendUrlInput.value.trim().replace(/\/+$/,"");return b?`${b}${p}`:p}function updateTarget(){const v=scaleSelect.value,en=v==="enhance8k",s=en?1:Number(v);scaleLabelEl.textContent=en?"增强 8K":`${s}x`;if(sourceBitmap)targetSizeEl.textContent=size(sourceBitmap.width*s,sourceBitmap.height*s)}function zoom(){const z=Number(zoomSelect.value);[originalCanvas,resultCanvas].forEach(c=>{if(c.width){c.style.width=Math.max(1,Math.round(c.width*z))+"px";c.style.height=Math.max(1,Math.round(c.height*z))+"px"}})}async function loadImage(file){if(!file||!file.type.startsWith("image/"))return;setProgress(0);downloadBtn.disabled=true;resultBlob=null;sourceFile=file;sourceName=file.name.replace(/\.[^.]+$/,"")||"upscaled";fileNameEl.textContent=file.name;setStatus("正在读取图片");const bm=await createImageBitmap(file,{colorSpaceConversion:"default"});sourceBitmap?.close?.();sourceBitmap=bm;sourceSizeEl.textContent=size(bm.width,bm.height);originalPaneSize.textContent=size(bm.width,bm.height);resultPaneSize.textContent="等待处理";updateTarget();processBtn.disabled=!aiReady;compare.hidden=false;empty.hidden=true;originalCanvas.width=bm.width;originalCanvas.height=bm.height;originalCtx.clearRect(0,0,bm.width,bm.height);originalCtx.drawImage(bm,0,0);resultCanvas.width=bm.width;resultCanvas.height=bm.height;resultCtx.clearRect(0,0,bm.width,bm.height);resultCtx.globalAlpha=.42;resultCtx.drawImage(bm,0,0);resultCtx.globalAlpha=1;zoom();setStatus("图片已载入")}async function checkAi(){try{const r=await fetch(apiUrl("/api/health"),{cache:"no-store"});const h=await r.json();aiReady=!!h.ok;setStatus(aiReady?"AI 引擎已就绪":"AI 引擎未安装",!aiReady);processBtn.disabled=!sourceBitmap||!aiReady}catch(e){aiReady=false;setStatus("AI 后端未运行。若使用 GitHub Pages，请填写公网 AI 后端地址。",true);processBtn.disabled=true}}async function processImage(){if(!sourceBitmap||!sourceFile||processing)return;if(!aiReady){setStatus("AI 引擎未就绪。请启动 server.py 或填写公网后端地址。",true);return}processing=true;processBtn.disabled=true;downloadBtn.disabled=true;resultBlob=null;setProgress(2);try{const v=scaleSelect.value,en=v==="enhance8k",s=en?2:Number(v);targetSizeEl.textContent=size(sourceBitmap.width*(en?1:s),sourceBitmap.height*(en?1:s));resultPaneSize.textContent="正在处理";setStatus(en?"正在运行 Real-ESRGAN 增强 8K":"正在运行 Real-ESRGAN AI 放大");setProgress(12);const payload={filename:sourceFile.name,scale:s,model:modelSelect.value,image:await fileToDataUrl(sourceFile)};const r=await fetch(apiUrl("/api/upscale"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const res=await r.json();if(!r.ok||!res.ok)throw new Error(res.error||"AI 放大失败");setProgress(78);resultBlob=new Blob([b64(res.image)],{type:res.mime||"image/png"});const bm=await createImageBitmap(resultBlob);resultCanvas.width=en?sourceBitmap.width:bm.width;resultCanvas.height=en?sourceBitmap.height:bm.height;resultCtx.clearRect(0,0,resultCanvas.width,resultCanvas.height);resultCtx.imageSmoothingEnabled=true;resultCtx.imageSmoothingQuality="high";resultCtx.drawImage(bm,0,0,resultCanvas.width,resultCanvas.height);if(en)resultBlob=await canvasBlob(resultCanvas);resultPaneSize.textContent=en?`${size(resultCanvas.width,resultCanvas.height)} 增强`:size(bm.width,bm.height);targetSizeEl.textContent=size(resultCanvas.width,resultCanvas.height);zoom();setProgress(100);setStatus(en?"8K 增强完成，可以对比查看细节":"AI 放大完成，可以对比查看细节");downloadBtn.disabled=false}catch(e){resultPaneSize.textContent="处理失败";setStatus(e.message||"处理失败",true)}finally{processing=false;processBtn.disabled=!sourceBitmap||!aiReady}}function download(){if(!resultBlob)return;const a=document.createElement("a"),v=scaleSelect.value;a.href=URL.createObjectURL(resultBlob);a.download=v==="enhance8k"?`${sourceName}_AI_${modelSelect.value}_enhance8K.png`:`${sourceName}_AI_${modelSelect.value}_${v}x.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}function fileToDataUrl(f){return new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>bad(r.error||new Error("无法读取文件"));r.readAsDataURL(f)})}function canvasBlob(c){return new Promise((ok,bad)=>c.toBlob(b=>b?ok(b):bad(new Error("无法生成导出图片")),"image/png"))}function b64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}function drag(p){let on=false,x=0,y=0,l=0,t=0;p.addEventListener("pointerdown",e=>{if(e.button!==0)return;on=true;x=e.clientX;y=e.clientY;l=p.scrollLeft;t=p.scrollTop;p.classList.add("dragging");p.setPointerCapture(e.pointerId)});p.addEventListener("pointermove",e=>{if(!on)return;e.preventDefault();p.scrollLeft=l-(e.clientX-x);p.scrollTop=t-(e.clientY-y)});function stop(e){if(!on)return;on=false;p.classList.remove("dragging");if(p.hasPointerCapture(e.pointerId))p.releasePointerCapture(e.pointerId)}p.addEventListener("pointerup",stop);p.addEventListener("pointercancel",stop);p.addEventListener("pointerleave",stop)}fileInput.addEventListener("change",()=>loadImage(fileInput.files[0]).catch(e=>setStatus(e.message,true)));scaleSelect.addEventListener("change",updateTarget);zoomSelect.addEventListener("change",zoom);backendUrlInput.addEventListener("change",checkAi);processBtn.addEventListener("click",processImage);downloadBtn.addEventListener("click",download);["dragenter","dragover"].forEach(n=>dropzone.addEventListener(n,e=>{e.preventDefault();dropzone.classList.add("dragover")}));["dragleave","drop"].forEach(n=>dropzone.addEventListener(n,e=>{e.preventDefault();dropzone.classList.remove("dragover")}));dropzone.addEventListener("drop",e=>loadImage(e.dataTransfer.files[0]).catch(err=>setStatus(err.message,true)));document.querySelectorAll(".scroll").forEach(drag);checkAi();
</script>
</body>
</html>
